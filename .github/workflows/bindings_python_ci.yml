name: Bindings Python CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**'                                       # Include all files and directories in the repository by default.
      - '!.github/ISSUE_TEMPLATE/**'               # Exclude files and directories that don't impact tests or code like templates, metadata, and documentation.
      - '!dev/release/**'
      - '!website/**'
      - '!.asf.yml'
      - '!.gitattributes'
      - '!.gitignore'
      - '!CONTRIBUTING.md'
      - '!CHANGELOG.md'
      - '!LICENSE'
      - '!NOTICE'
      - '!README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-python:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.9.3"
          enable-cache: true
      - name: Install tools
        run: |
          uv tool install ruff
      - name: Check format
        working-directory: "bindings/python"
        run: |
          uvx ruff format . --diff
      - name: Check style
        working-directory: "bindings/python"
        run: |
          uvx ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 15
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12
      # This job passes no manylinux/target inputs, so maturin-action builds
      # on the host on every OS (a manylinux container is only used when
      # `manylinux` is set, as the release workflows do) - host Rust caching
      # helps all three platforms.
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      # Image + build-definition files in the key so changed steps or a new
      # runner image rotate the cache and a stale cache can heal itself; the
      # rust-cache environment hash is dropped because its preinstalled-stable
      # component varies across concurrent image builds and breaks restores.
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: bindings-python-${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/bindings_python_ci.yml', 'bindings/python/pyproject.toml', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: 'false'
      # `--profile ci` overrides the size-optimized release profile from
      # pyproject.toml: PR validation only needs a wheel that builds fast and
      # runs the test suite; the publish workflows pass their own profile.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: "bindings/python"
          command: build
          args: --out dist -i python3.12 --profile ci # Explicitly set interpreter; manylinux containers have multiple Pythons and maturin may pick an older one
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: "0.9.3"
          enable-cache: true
      - name: Sync dependencies
        working-directory: "bindings/python"
        shell: bash
        run: |
          uv sync --group dev --no-install-project
      - name: Install built wheel
        working-directory: "bindings/python"
        shell: bash
        run: |
          uv pip install --no-build --reinstall --find-links dist/ pyiceberg-core
      - name: Run tests
        working-directory: "bindings/python"
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          make test
