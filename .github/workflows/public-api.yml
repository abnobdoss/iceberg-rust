name: Public API

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'crates/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder

      # The runner image and the files defining the build steps go into the
      # cache key: artifacts depend on both, and a full primary-key hit makes
      # rust-cache skip saving, so a cache from outdated steps or a different
      # image could otherwise never heal itself.
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/public-api.yml', 'Makefile', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # cargo-public-api has no prebuilt binaries anywhere (no release assets
      # upstream, unsupported by install-action, absent from quickinstall), so
      # the make target's pinned `cargo install` is the only way to get it.
      # rust-cache's cargo-bin caching makes that install a no-op on warm runs
      # as long as no other step overwrites the installed binary.
      - name: Check public API
        run: make check-public-api
