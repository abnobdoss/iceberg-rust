name: CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**'                              # Include all files and directories in the repository by default.
      - '!.github/ISSUE_TEMPLATE/**'      # Exclude files and directories that don't impact tests or code like templates, metadata, and documentation.
      - '!dev/release/**'
      - '!website/**'
      - '!.asf.yml'
      - '!.gitattributes'
      - '!.gitignore'
      - '!CONTRIBUTING.md'
      - '!CHANGELOG.md'
      - '!LICENSE'
      - '!NOTICE'
      - '!README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder

      - name: Install lint tools
        # Keep versions in sync with the local install targets in Makefile.
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: taplo@0.9.3,cargo-machete@0.7.0

      - name: Check License Header
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0

      - name: Check toml format
        run: taplo fmt --check

      - name: Cargo format
        run: make check-fmt

      - name: Check diff
        run: git diff --exit-code

      - name: Check Cargo.lock is up-to-date
        run: cargo update --workspace --locked

      - name: Cargo Machete
        run: cargo machete

      - name: Check typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  clippy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder

      # clippy compiles the whole dep graph in check mode, so cache it like the
      # build jobs; see the build job for the keying rationale.
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Makefile', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: 'false'

      - name: Cargo clippy
        run: make check-clippy

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      max-parallel: 15
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder

      # The runner image and the files defining the build steps go into the
      # cache key: artifacts depend on both, and a full primary-key hit makes
      # rust-cache skip saving, so a cache from outdated steps or a different
      # image could otherwise never heal itself. rust-cache's own environment
      # hash is disabled because it includes the image-preinstalled stable
      # toolchain, which no job uses and which varies across concurrent image
      # builds, randomly breaking restores; everything else it covered is
      # already keyed (env vars live in this file, the pinned toolchain in
      # rust-toolchain.toml, which rust-cache hashes).
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Makefile', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: 'false'

      # Folded in from the former build_with_no_default_features job so the
      # core crate's feature gating is checked without a second dep closure.
      - name: Build without default features
        run: cargo build --locked -p iceberg --no-default-features

      - name: Build
        run: make build

  # Checks each crate individually to catch missing feature declarations that
  # are otherwise masked by Cargo's feature unification across the workspace.
  check_standalone:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder

      # Image + build-definition files in the key so changed steps or a new
      # runner image rotate the cache; see the build job for the rationale.
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Makefile', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: 'false'

      - name: Check each crate standalone
        run: |
          for pkg in $(cargo metadata --no-deps --format-version=1 | jq -r '.packages[].name'); do
            echo "Checking $pkg..."
            cargo check -p "$pkg" --all-targets || exit 1
          done

  # The ubuntu build and tests share one runner so the dependency graph
  # compiles once instead of once per job. Docker containers start in the
  # background while the workspace builds so their startup time overlaps the
  # compile. macOS and Windows keep their own build job above; clippy and the
  # standalone crate checks run as separate ubuntu jobs.
  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Container startup overlaps the workspace build; the wait step below
      # joins on the result before the tests need the containers.
      - name: Start Docker containers in the background
        run: make docker-up-background

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder

      # Image + build-definition files in the key so changed steps or a new
      # runner image rotate the cache; see the build job for the rationale.
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Makefile', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: 'false'

      - name: Build without default features
        run: cargo build --locked -p iceberg --no-default-features

      - name: Build
        run: cargo build --locked --all-targets --all-features --workspace

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: cargo-nextest

      - name: Wait for Docker containers
        run: make docker-wait

      - name: Run tests
        shell: bash
        env:
          # HuggingFace Hub integration tests self-skip when these are unset
          # (e.g. PRs from forks); see crates/storage/opendal/tests/file_io_hf_test.rs
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ secrets.HF_BUCKET }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: cargo nextest run --all-targets --all-features --workspace

      - name: Run doc tests
        run: cargo test --no-fail-fast --doc --all-features --workspace

      - name: Stop Docker containers
        if: always()
        run: make docker-down

  msrv:
    name: Verify MSRV
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Get MSRV
        id: get-msrv
        uses: ./.github/actions/get-msrv
      - name: Setup MSRV Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ steps.get-msrv.outputs.msrv }}
      - name: Setup Nightly Rust toolchain
        uses: ./.github/actions/setup-builder
      # The MSRV job had no cache; give it one keyed like the build jobs (see
      # the build job for the rationale). The msrv- prefix rotates it on MSRV
      # bumps and keeps the lineage self-describing.
      - name: Get runner image id
        id: image
        shell: bash
        run: echo "id=${ImageOS:?}" >> "$GITHUB_OUTPUT"
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv-${{ steps.get-msrv.outputs.msrv }}-${{ steps.image.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Makefile', 'Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: 'false'
      - name: Check MSRV
        run: make check-msrv
